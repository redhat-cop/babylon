---
nameOverride: ""

namespace:
  create: true
  name:

# Interface name to filter which catalog namespaces to present to the user
interfaceName:

api:
  name: # default use chart name + '-api'
  gunicorn:
    processes: 5
    threads: 1
  image:
    #override:
    tag: v1.3.7
    repository: quay.io/redhat-gpte/babylon-catalog-api
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "2Gi"
  serviceAccount:
    name: # default use api component name

# CatalogItemOrder approval workflow (GPTEINFRA-18188). Opt-in: keep disabled until
# approval decisions (GPTEINFRA-18189), UI (GPTEINFRA-18190) and enforcement on legacy
# and direct provisioning paths (GPTEINFRA-18191) are deployed. Enabling this does not
# make legacy ResourceClaim/Workshop creation enforce approval policies.
catalogItemOrders:
  # Enables /api/catalog-item-orders endpoints, API RBAC and the order controller.
  enabled: false
  controller:
    name: # default use chart name + '-order-controller'
    replicaCount: 1
    # Public catalog URL used for resource url annotations and approval review links.
    catalogBaseUrl:
    # Defaults when a catalog item approval policy does not set them.
    approvalExpiresAfter: 72h
    retry:
      # Window measured from the time approval was satisfied.
      window: 72h
      # Total provisioning attempts, including the initial attempt.
      maxAttempts: 3
    resyncInterval: 60
    workers: 4
    resources:
      requests:
        cpu: 100m
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "512Mi"
    serviceAccount:
      name: # default use controller name

ui:
  name: # default use chart name + '-ui'
  image:
    #override:
    tag: v0.35.17
    repository: quay.io/redhat-gpte/babylon-catalog-ui
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "256Mi"

status:
  name: # default use chart name + '-status'
  image:
    tag: v1.0.5
    repository: quay.io/redhat-gpte/babylon-catalog-status
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "256Mi"

oauthProxy:
  name: # default use chart name + '-oauth-proxy'
  # OAuth client id and secret, if not defined then will attempt to use service account for oauth
  #clientId: ...
  #clientSecret: ...
  # Cookie secret should be 32 bytes long
  #cookieSecret: abcdefghijklmnopqrstuvwxyz012345
  image:
    #override:
    pullPolicy: Always
    repository: registry.redhat.io/openshift4/ose-oauth-proxy
    tag: v4.12
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "256Mi"
  # Custom oauth-proxy templates.
  # For built-in templates see https://github.com/openshift/oauth-proxy/blob/master/templates.go
  #templates:
  #  error.html: |
  #    <!DOCTYPE html>
  #    <html lang="en" charset="utf-8">
  #    ...
  #    </html>
  #  sign_in.html: |
  #    <!DOCTYPE html>
  #    <html lang="en" charset="utf-8">
  #    ...
  #    </html>

redis:
  name: # default use chart name + '-redis'
  deploy: true
  password: null
  generatePassword: true
  image:
    #override:
    pullPolicy: Always
    repository: image-registry.openshift-image-registry.svc:5000/openshift/redis
    tag: 5-el8
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 256Mi
route:
  certManager:
    enable: false
  certUtilsOperator:
    enable: false
  create: true
  host:

salesforceApi:
  deploy: true
  secretName: salesforce-api

sandboxApi:
  deploy: true
  secretName: sandbox-api

sharedClusterManager:
  deploy: true
  secretName: sandbox-api-shared-cluster-manager

jira:
  deploy: true
  secretName: babylon-catalog-jira
