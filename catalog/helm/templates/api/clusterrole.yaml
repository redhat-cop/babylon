apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "babylonCatalog.apiClusterRoleName" . }}
  labels:
    {{- include "babylonCatalog.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  - user.openshift.io
  resources:
  - groups
  - users
  verbs:
  - get
  - impersonate
  - list
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - create
  - patch
  - update
- apiGroups:
  - babylon.gpte.redhat.com
  resources:
  - selfpacedlabs
  - selfpacedlabprovisionitems
  verbs:
  - get
  - list
- apiGroups:
  - babylon.gpte.redhat.com
  resources:
  - selfpacedlabuserassignments
  verbs:
  - get
  - list
  - update
- apiGroups:
  - babylon.gpte.redhat.com
  resources:
  - workshopprovisions
  verbs:
  - get
  - list
  - patch
- apiGroups:
  - babylon.gpte.redhat.com
  resources:
  - workshops
  - multiworkshops
  verbs:
  - get
  - list
  - patch
  - watch
  - update
- apiGroups:
  - poolboy.gpte.redhat.com
  resources:
  - resourcehandles
  verbs:
  - get
  - list
{{- if .Values.catalogItemOrders.enabled }}
# CatalogItemOrders are created and read with the API service account after
# session ownership checks. Status updates implement cancel and retry requests
# with resourceVersion preconditions. The API never updates order spec.
- apiGroups:
  - babylon.gpte.redhat.com
  resources:
  - catalogitemorders
  verbs:
  - create
  - get
  - list
- apiGroups:
  - babylon.gpte.redhat.com
  resources:
  - catalogitemorders/status
  verbs:
  - get
  - update
{{- end }}
