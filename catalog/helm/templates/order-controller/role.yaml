{{- if .Values.catalogItemOrders.enabled }}
# Read the system status ConfigMap holding ordering blocks in the catalog namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "babylonCatalog.orderControllerName" . }}
  namespace: {{ include "babylonCatalog.namespaceName" . }}
  labels:
    {{- include "babylonCatalog.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - babylon-system-status
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "babylonCatalog.orderControllerName" . }}
  namespace: {{ include "babylonCatalog.namespaceName" . }}
  labels:
    {{- include "babylonCatalog.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "babylonCatalog.orderControllerName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "babylonCatalog.orderControllerServiceAccountName" . }}
  namespace: {{ include "babylonCatalog.namespaceName" . }}
{{- end }}
