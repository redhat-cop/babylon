---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: babylon-user-service-access
  annotations:
    description: >-
      Access to manage Babylon services.
  labels:
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    {{- include "babylon.labels" . | nindent 4 }}
rules:
# No `create` on ResourceClaims and WorkshopProvisions: they are created only by
# the CatalogItemOrder controller (after any required approval), workshop-manager
# and administrators, so users cannot bypass approval with direct writes. The
# custom `order` verb is what the catalog API and order controller check before
# accepting and fulfilling an order; no API request uses it.
- apiGroups:
  - {{ .Values.resourceBroker.api.group }}
  resources:
  - resourceclaims
  verbs:
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - {{ .Values.resourceBroker.api.group }}
  resources:
  - resourceclaims
  verbs:
  - order
- apiGroups:
  - {{ .Values.catalog.api.group }}
  resources:
  - workshops
  - workshopuserassignments
  - multiworkshops
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
  - update
- apiGroups:
  - {{ .Values.catalog.api.group }}
  resources:
  - workshopprovisions
  verbs:
  - delete
  - get
  - list
  - patch
  - watch
  - update
- apiGroups:
  - {{ .Values.catalog.api.group }}
  resources:
  - workshops
  verbs:
  - order
- apiGroups:
  - {{ .Values.catalog.api.group }}
  resources:
  - serviceaccesses
  - tenantclusterpools
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - {{ .Values.catalog.api.group }}
  resources:
  - serviceaccessconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - {{ .Values.catalog.api.group }}
  resources:
  - whitegloverequests
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
