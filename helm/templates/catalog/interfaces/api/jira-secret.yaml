{{- range $namespace, $interface := .Values.catalog.interfaces }}
---
apiVersion: bitwarden-k8s-secrets-manager.demo.redhat.com/v1
kind: BitwardenSyncSecret
metadata:
  name: babylon-catalog-jira
  namespace: {{ $namespace }}
spec:
  data:
    jira-client-id:
      secret: jira_credentials
      key: client_id
    jira-client-secret:
      secret: jira_credentials
      key: client_secret
    jira-cloud-id:
      secret: jira_credentials
      key: cloud_id
    jira-base-url:
      secret: jira_credentials
      key: base_url
    jira-project-key:
      secret: jira_credentials
      key: project_key
{{- end }}
