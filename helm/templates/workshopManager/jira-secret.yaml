{{- $workshopManager := .Values.workshopManager }}
{{- if and $workshopManager.deploy $workshopManager.jira.deploy }}
---
apiVersion: bitwarden-k8s-secrets-manager.demo.redhat.com/v1
kind: BitwardenSyncSecret
metadata:
  name: {{ $workshopManager.jira.secretName | default "babylon-workshop-manager-jira" }}
  namespace: {{ $workshopManager.namespace.name }}
  labels:
    {{- include "babylon.labels" . | nindent 4 }}
    app.kubernetes.io/component: workshop-manager
spec:
  data:
    jira-api-token:
      secret: jira_credentials
      key: api_token
    jira-user-email:
      secret: jira_credentials
      key: user_email
    jira-base-url:
      secret: jira_credentials
      key: base_url
{{- end }}
