---
name: cli-release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check release tag and draft status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != "tag" ]]; then
            printf '%s\n' '::error::Run this workflow from a release tag, not a branch. See cli/RELEASING.adoc.'
            exit 1
          fi
          DRAFT=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .draft')
          if [[ -n "$DRAFT" && "$DRAFT" != "true" ]]; then
            printf '%s\n' '::error::This tag already has a published release. Use a new version tag so assets can be uploaded before publication.'
            exit 1
          fi

  build:
    needs: check-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod

      - name: Build
        working-directory: cli
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          EXT=""
          if [[ "${{ matrix.goos }}" == "windows" ]]; then EXT=".exe"; fi
          OUTPUT="babylon-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          mkdir -p ../build
          go build \
            -ldflags="-X main.version=$VERSION -X main.buildCommit=${{ github.sha }} -X 'main.buildTime=$(date -u)'" \
            -o "../build/${OUTPUT}" .
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: babylon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/babylon-*

  release-assets:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: babylon-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum babylon-* > sha256sums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/babylon-*

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          DRAFT=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .draft')
          if [[ "$DRAFT" == "true" ]]; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          elif [[ -z "$DRAFT" ]]; then
            gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --generate-notes
          else
            printf '%s\n' '::error::The release was published before the assets were uploaded. Use a new version tag.'
            exit 1
          fi
